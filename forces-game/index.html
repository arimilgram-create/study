<meta charset="utf-8">
<title>Inertia Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: graph-paper lab notebook; sticky arcade HUD; station grid that opens into a one-column level stage.
   Teacher-purple handwriting = feedback (like the answer key). Each force keeps one color everywhere. */
:root{
  --paper:#e3ecf5; --grid:rgba(38,108,150,.10); --ink:#1b1d22; --muted:#545e6c; --card:#ffffff;
  --line:#ccd6e2; --edge:#1b1d22; --shade:#1b1d22; --hi:#ffd21f; --on-hi:#1b1d22;
  --pen:#9b30d9; --good:#22a03a; --bad:#e0263f; --accent:#1e7bf0; --soft:#edf2f8;
  --r-common:#7b8798; --r-rare:#2f7de1; --r-epic:#9c36b5; --r-leg:#d98e00; --r-myth:#e03131;
  --f-g:#d9362b; --f-n:#1c6fd1; --f-a:#e67700; --f-f:#b3246b; --f-air:#0b7f8f; --f-lift:#2b8a3e; --f-eng:#9c6500; --f-s:#5f3dc4; --f-ten:#c2410c;
  /* Roblox-style GUI: sky, baseplate studs, glossy button faces (top, bottom) */
  --sky1:#74c4ff; --sky2:#d6efff; --stud:rgba(255,255,255,.42); --hud:rgba(18,22,30,.9);
  --btn1:#ffffff; --btn2:#dbe2ea; --gloss:rgba(255,255,255,.55);
  --green1:#82e86c; --green2:#22a03a; --blue1:#6cc0ff; --blue2:#1e74e8; --gold1:#ffe36b; --gold2:#ffaa00;
  --purple1:#cf8bff; --purple2:#8a2be2; --red1:#ff8a96; --red2:#d91f3c;
  --ae1:#eef3f8; --ae2:#c9d4e1; --ae-tile:#eef2f7;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141922; --grid:rgba(140,190,230,.07); --ink:#eef2f7; --muted:#a3adbb; --card:#272e3b;
  --line:#3a4454; --edge:#07090c; --shade:#07090c; --hi:#ffd43b; --on-hi:#18212d;
  --pen:#d68cff; --good:#45c47b; --bad:#ff6b61; --accent:#5aa2ff; --soft:#1f2531;
  --sky1:#1d2c47; --sky2:#151b26; --stud:rgba(255,255,255,.035); --hud:rgba(10,12,17,.92);
  --btn1:#46505f; --btn2:#2c333f; --gloss:rgba(255,255,255,.14);
  --ae1:#353e4d; --ae2:#1b2029; --ae-tile:#202631;
  --r-common:#9aa6b8; --r-rare:#5aa2ff; --r-epic:#d77cf0; --r-leg:#fcc419; --r-myth:#ff6b6b;
  --f-g:#ff6b61; --f-n:#5aa2ff; --f-a:#ffa94d; --f-f:#f06595; --f-air:#3bc9db; --f-lift:#69db7c; --f-eng:#e0a841; --f-s:#9775fa; --f-ten:#ff922b;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#141922; --grid:rgba(140,190,230,.07); --ink:#eef2f7; --muted:#a3adbb; --card:#272e3b;
  --line:#3a4454; --edge:#07090c; --shade:#07090c; --hi:#ffd43b; --on-hi:#18212d;
  --pen:#d68cff; --good:#45c47b; --bad:#ff6b61; --accent:#5aa2ff; --soft:#1f2531;
  --sky1:#1d2c47; --sky2:#151b26; --stud:rgba(255,255,255,.035); --hud:rgba(10,12,17,.92);
  --btn1:#46505f; --btn2:#2c333f; --gloss:rgba(255,255,255,.14);
  --ae1:#353e4d; --ae2:#1b2029; --ae-tile:#202631;
  --r-common:#9aa6b8; --r-rare:#5aa2ff; --r-epic:#d77cf0; --r-leg:#fcc419; --r-myth:#ff6b6b;
  --f-g:#ff6b61; --f-n:#5aa2ff; --f-a:#ffa94d; --f-f:#f06595; --f-air:#3bc9db; --f-lift:#69db7c; --f-eng:#e0a841; --f-s:#9775fa; --f-ten:#ff922b;
  color-scheme:dark }

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font:17px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
sub{font-size:.7em}
.eq,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--edge);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;flex-wrap:wrap}
.logo{border:0;background:none;font-family:var(--display);font-size:1.25rem;padding:0;letter-spacing:.02em}
.logo span{background:var(--hi);color:var(--on-hi);padding:0 .25em;margin-left:.2em;border-radius:4px}
.hud-stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:1rem}
.stat.hot b{color:var(--f-a)}
.icon-btn{border:2px solid var(--edge);background:var(--soft);border-radius:999px;padding:3px 10px;font-size:.8rem}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}

/* Buttons */
.btn{border:2px solid var(--edge);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;
  box-shadow:0 3px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--shade)}
.btn.primary{background:var(--hi);color:var(--on-hi)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.on{background:var(--ink);color:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Map */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center;margin-bottom:18px}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem)}
.hero h1 em{font-style:normal;color:var(--pen)}
.hero p{max-width:60ch;color:var(--muted);margin:.6em 0 0}
.cheat{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:12px 16px;box-shadow:4px 4px 0 var(--shade);margin-bottom:8px}
.cheat .eq{display:block;font-size:1rem;line-height:1.8}
.cheat small{display:block;color:var(--muted);margin-top:4px;font-size:.85rem}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.sec-head h2{font-size:1.4rem}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem}
.station.extra{background:var(--soft)}
.station.extra .tag > span:first-child{color:var(--pen);font-weight:700}
/* player card */
.player{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:12px;box-shadow:4px 4px 0 var(--shade)}
.player-av{border:2px solid var(--edge);border-radius:12px;padding:0;overflow:hidden;background:none;line-height:0}
.player-av > svg,.char-av > svg,.cel-av > svg{width:100%;height:auto;display:block}
.player-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.player-info .mono{font-size:.85rem;color:var(--muted)}
.pname{font-family:var(--display);font-weight:400;font-size:1.3rem;overflow-wrap:anywhere}
.ptitle{color:var(--pen);font-weight:700}
.me-btn{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);background:var(--soft);border-radius:999px;padding:2px 12px 2px 2px;text-align:left;max-width:220px}
.mini-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--edge);background:var(--card)}
.mini-av > svg{width:100%;height:100%;display:block}
.me-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.me-txt b{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-txt small{font-size:.7rem;color:var(--pen);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shopBtn.glow{animation:glow 1.4s ease-in-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend span{font-family:var(--mono);font-size:.8rem;border:2px solid currentColor;border-radius:999px;padding:0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.station{text-align:left;border:2px solid var(--edge);background:var(--card);border-radius:var(--r);padding:14px 16px;
  box-shadow:4px 4px 0 var(--shade);display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.station:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shade)}
.station .tag{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.station h2{font-size:1.2rem}
.station p{margin:0;color:var(--muted);font-size:.93rem}
.stars{color:var(--f-a);letter-spacing:.1em;font-size:1rem}
.stars .off{color:var(--line)}
.station.boss{grid-column:1/-1;background:var(--ink);color:var(--card)}
.station.boss p,.station.boss .tag{color:var(--line)}
.station.boss h2{font-size:1.6rem;color:var(--hi)}

/* Level stage */
.lvl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lvl-head h2{font-size:clamp(1.3rem,4vw,1.9rem);flex:1;min-width:0}
.lvl-head .tag{font-family:var(--mono);font-size:.8rem;background:var(--hi);color:var(--on-hi);padding:2px 8px;border-radius:6px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--edge);background:var(--card)}
.dots i.done{background:var(--good);border-color:var(--good)}
.dots i.now{background:var(--hi)}
.step{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:18px;box-shadow:5px 5px 0 var(--shade);
  display:flex;flex-direction:column;gap:14px;animation:pop .25s ease-out}
.step .q{font-size:1.1rem;font-weight:700;max-width:65ch}
.step .ctx{color:var(--muted);max-width:65ch;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{text-align:left;border:2px solid var(--edge);background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.opt:hover:not(:disabled){background:var(--hi);color:var(--on-hi)}
.opt.right{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:transparent;border-style:dashed;color:var(--muted);text-decoration:line-through}
.opt svg{display:block;width:100%;max-width:170px;height:auto;margin-bottom:4px}
.num-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.num-row input{font:700 1.2rem var(--mono);width:9em;max-width:100%;padding:8px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink)}
.unit{font-family:var(--mono);font-weight:700}
.pen{font-family:var(--hand);color:var(--pen);font-size:1.45rem;line-height:1.25;max-width:65ch;animation:write .4s ease-out}
.pen.bad{color:var(--bad)}
.pen .eq{font-family:var(--hand);font-size:1.5rem;display:block;padding-left:1em}
.next-row{display:flex;justify-content:flex-end}
.hint{font-size:.9rem;color:var(--muted)}

/* FBD builder */
.fbd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.fbd svg{width:100%;height:auto;background:var(--soft);border-radius:12px;border:2px solid var(--line);touch-action:manipulation}
.zone{cursor:pointer}
.zone rect{fill:transparent;stroke:var(--muted);stroke-dasharray:6 5;stroke-width:2}
.armed .zone rect{stroke:var(--accent);fill:rgba(31,111,235,.08);animation:pulse 1s infinite}
.zone.badz rect{stroke:var(--bad);fill:rgba(217,54,43,.10);stroke-dasharray:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);border-radius:999px;padding:5px 12px;background:var(--card);display:flex;gap:6px;align-items:baseline;text-align:left}
.chip b{font-family:var(--mono);color:var(--c)}
.chip small{color:var(--muted);font-size:.8rem}
.chip.sel{background:var(--c);}
.chip.sel b,.chip.sel small{color:#fff}

/* Sorting game */
.sorter{display:flex;flex-direction:column;align-items:center;gap:14px}
.card-deck{position:relative;width:min(100%,420px);min-height:130px}
.sort-card{position:absolute;inset:0;background:var(--paper);border:2px solid var(--edge);border-radius:14px;padding:18px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:1.2rem;box-shadow:0 4px 0 var(--shade)}
.sort-card.fly-l{animation:flyL .35s forwards}.sort-card.fly-r{animation:flyR .35s forwards}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,420px)}
.bins .btn{font-family:var(--display);font-weight:400;font-size:1.1rem;padding:14px 8px}
.meter{width:min(100%,420px);height:10px;border:2px solid var(--edge);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}

/* Sims */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sim.one{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.panel > canvas,.panel > svg{display:block;width:100%;height:auto}
.readout{font-family:var(--mono);font-size:.95rem;display:flex;flex-direction:column;gap:2px}
.readout .big{font-size:1.3rem;font-weight:700}
.goal{border:2px dashed var(--edge);border-radius:10px;padding:8px 12px;font-size:.95rem}
.goal.met{border-style:solid;border-color:var(--good);color:var(--good)}
input[type=range]{width:100%;accent-color:var(--f-a)}

/* Result + boss */
.result{text-align:center;align-items:center}
.result .bigstars{font-size:3rem;color:var(--f-a);letter-spacing:.15em}
.result .bigstars .off{color:var(--line)}
.hearts{font-size:1.3rem;color:var(--bad);letter-spacing:.1em}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--f-a);width:100%}

.xp-pop{position:fixed;z-index:50;font:700 1.1rem var(--mono);color:var(--good);pointer-events:none;animation:rise 1s ease-out forwards;
  background:var(--card);border:2px solid var(--good);border-radius:8px;padding:2px 8px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.shake{animation:shake .35s}

/* case shop */
.cases .case-card{cursor:default;border-top:8px solid var(--cc)}
.cases .case-card:hover{transform:none;box-shadow:4px 4px 0 var(--shade)}
.case-art svg{width:120px;height:auto;display:block}
.odds{list-style:none;margin:4px 0 8px;padding:0;font-size:.85rem;font-family:var(--mono)}
.odds li{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.reel{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:12px;background:var(--soft);padding:12px 0;cursor:pointer}
.strip{display:flex;gap:8px;padding-left:0;will-change:transform}
.marker{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--hi);box-shadow:0 0 0 2px var(--shade)}
.tile{flex:none;width:120px;border:2px solid var(--line);border-bottom:6px solid var(--rc,var(--line));border-radius:10px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;font-size:.78rem;text-align:center;line-height:1.2;
  background-image:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc,transparent) 22%,transparent),transparent 70%)}
.tile.won{outline:4px solid var(--rc);outline-offset:2px;transform:scale(1.06);transition:transform .3s}
.ti-icon{width:84px;height:84px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}
.ti-icon > svg{width:100%;height:100%}
.ti-title{font-family:var(--hand);font-size:1.25rem;color:var(--pen);line-height:1.05;padding:4px}
.ti-q{font:400 2.4rem var(--display);color:var(--rc)}
.drop{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:center;margin-top:16px;border:3px solid var(--rc);border-radius:14px;padding:14px;
  background-image:radial-gradient(circle at 15% 50%,color-mix(in srgb,var(--rc) 25%,transparent),transparent 60%);animation:pop .4s ease-out}
.drop-icon{width:160px;height:160px;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}
.drop-icon > svg{width:100%;height:100%}
.drop-icon .ti-title{font-size:1.8rem;text-align:center}
.drop-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.drop-info p{margin:0}
.rarity{font:700 .8rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
/* character + locker */
.char{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.char-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:12px;box-shadow:5px 5px 0 var(--shade)}
.char-av{border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.char-cap{display:flex;flex-direction:column;align-items:center;margin-top:8px;text-align:center}
.char-cap b{font-family:var(--display);font-weight:400;font-size:1.3rem;overflow-wrap:anywhere}
.char-cap span{color:var(--pen);font-weight:700}
.char-panel{display:flex;flex-direction:column;gap:14px}
.choice{display:flex;flex-direction:column;gap:6px}
.choice .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--edge)}
.name-in{font:700 1.1rem var(--body);padding:8px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%;width:16em}
.slot-h{font-size:1rem;margin-top:8px}
.locker{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.locker .tile{width:auto;cursor:pointer}
.locker .tile.locked{opacity:.55;cursor:not-allowed}
.locker .tile.eq{outline:3px solid var(--good);outline-offset:1px}
.locker .tile.none .ti-icon{font-weight:700;color:var(--muted)}
/* result celebration */
.celebrate{display:flex;flex-direction:column;align-items:center;gap:6px}
.cel-av{width:150px;border-radius:14px;overflow:hidden;border:2px solid var(--edge);animation:hop .9s ease-in-out 2}
.bubble{background:var(--hi);color:var(--on-hi);font-weight:700;border:2px solid var(--edge);border-radius:14px;padding:6px 12px;position:relative}
.opt.reveal{outline:3px dashed var(--good);outline-offset:2px}
/* ranking widget */
.rank-pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.rank-card{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--edge);border-radius:10px;background:var(--soft);padding:8px 10px;font-size:.92rem}
.rank-card b{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--pen)}
.rank-card:disabled{opacity:.35}
.rank-label{display:flex;align-items:center;gap:8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.rank-label span{flex:1;height:2px;background:var(--line)}
.rank-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px}
.rank-slot{font:400 1.4rem var(--display);width:48px;height:48px;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--pen)}
.rank-sign{font:700 1.4rem var(--mono);width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);background:var(--hi);color:var(--on-hi)}
/* lock in: show-your-work */
.lockin{display:flex;align-items:center;gap:10px;background:var(--hi);color:var(--on-hi);border:2px solid var(--edge);border-radius:10px;padding:8px 12px;font-size:.95rem}
.lockin svg{flex:none}
.lockcard{display:flex;gap:16px;align-items:flex-start;margin:22px 0 4px;border:3px solid var(--edge);border-radius:var(--r);padding:16px 18px;background:var(--hi);color:var(--on-hi);box-shadow:5px 5px 0 var(--shade)}
.lockcard svg{width:44px;height:44px;flex:none}
.lockcard h2{font-size:1.4rem;margin-bottom:6px}
.lockcard p{margin:4px 0;max-width:72ch}
.paper{border:2px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 37px,var(--grid) 37px 38px)}
.wrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.wrow:last-child{border-bottom:0}
.wnum{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;font:700 .95rem var(--mono)}
.wbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.wtitle{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.whand{font-family:var(--hand);color:var(--pen);font-size:1.6rem;line-height:1.2;overflow-wrap:anywhere;animation:write .4s ease-out}
.eqopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.eqchip{font:600 1rem var(--mono);text-align:left;border:2px solid var(--edge);border-radius:10px;background:var(--card);padding:8px 12px}
.eqchip:hover:not(:disabled){background:var(--hi);color:var(--on-hi)}
.eqchip:disabled{opacity:.4;text-decoration:line-through}
.plugline{font:600 1.1rem var(--mono);line-height:2.4;overflow-wrap:anywhere}
.blank,.ansbox{font:700 1.05rem var(--mono);width:6.2em;max-width:42vw;padding:4px 8px;border:2px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink);margin:0 3px}
.blank.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.unitsel{font:700 1rem var(--mono);padding:5px 6px;border:2px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink)}
.wlhs{font:600 1.1rem var(--mono)}
.fullwork{display:flex;align-items:center;gap:10px;border:2px solid var(--good);color:var(--good);border-radius:10px;padding:8px 12px;font-weight:700;animation:pop .3s}
/* graphs */
.plot{width:100%;height:auto;display:block;max-width:560px}
.gdraw svg{width:100%;max-width:620px;height:auto;display:block;background:var(--card);border:2px solid var(--line);border-radius:12px;touch-action:manipulation;cursor:crosshair}
.mini-fbd svg{max-width:220px;margin:0 auto;display:block}
.track svg{max-width:640px;margin:0 auto;display:block}
.step .q + div svg.plot,.step > div > svg.plot{max-width:520px}
/* shop upgrades */
.case-card{position:relative}
.new-badge{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font:700 .75rem var(--mono);padding:2px 8px;border-radius:999px;letter-spacing:.1em}
.odds .shiny-odds{color:var(--pen)}
.ghost-link{align-self:flex-start;box-shadow:none}
.contents{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.contents .rarity{color:var(--rc)}
.mini-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.mini-tiles .tile{width:auto;font-size:.66rem;padding:4px}
.mini-tiles .ti-icon{width:52px;height:52px}
.tile.owned{outline:2px solid var(--good)}
.tile.shiny,.drop.shiny,.ti-icon.shiny{position:relative;background-image:linear-gradient(115deg,#ffd43b33,#74c0fc33,#f0659533,#69db7c33,#ffd43b33);background-size:300% 100%;animation:holo 2.4s linear infinite}
.tile.shiny{border-color:#fcc419}
.case-art.opening{display:flex;justify-content:center;padding:30px 0;animation:shakecase .7s ease-in}
.case-art.opening svg{width:180px}
.case-art.opening .lid{animation:lid .7s ease-in forwards;transform-origin:60px 20px}
.flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 55%,transparent),transparent 70%);animation:flashout .9s ease-out forwards}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;perspective:800px}
.flip{height:170px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.flip-back,.flip-front{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:12px}
.flip-back{background:var(--soft);border:3px solid var(--cc)}
.flip-back svg{width:80%}
.flip-front{transform:rotateY(180deg)}
.flip-front .tile{width:100%;height:100%;justify-content:center}
.flip.open .flip-front .tile{box-shadow:0 0 18px color-mix(in srgb,var(--rc) 70%,transparent)}
/* casino */
.chip-pill{display:flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:999px;padding:4px 12px;background:var(--card);font-family:var(--mono)}
.chip-ico{width:18px;height:18px;border-radius:50%;background:var(--r-leg);border:3px dashed var(--card);box-shadow:0 0 0 2px var(--edge)}
.chipbal{font-size:1.1rem}
.bet{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bet .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.betin{font:700 1.05rem var(--mono);width:6em;padding:6px 8px;border:2px solid var(--edge);border-radius:8px;background:var(--card);color:var(--ink)}
.trade-list{display:flex;flex-direction:column;gap:6px}
.trade-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--line);border-left:6px solid var(--rc);border-radius:10px;padding:6px 10px;background:var(--card)}
.ti-icon.sm{width:52px;height:52px}
.trade-name{display:flex;flex-direction:column;min-width:0}
.trade-name span{font-size:.85rem;color:var(--muted)}
.plinko-wrap{max-width:400px;margin:0 auto;width:100%}
.coin-stage{display:flex;justify-content:center;padding:16px;perspective:600px}
.coin{width:140px;height:140px;position:relative;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}
.coin-face{position:absolute;inset:0;backface-visibility:hidden}
.coin-face svg{width:100%;height:100%}
.coin-face.back{transform:rotateY(180deg)}
.casino-note{max-width:72ch;margin-top:14px}
.xp-pop.chip{color:var(--r-leg);border-color:var(--r-leg)}
.xp-pop.bad{color:var(--bad);border-color:var(--bad)}
@keyframes holo{to{background-position:300% 0}}
@keyframes shakecase{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-6deg) scale(1.04)}80%{transform:rotate(6deg) scale(1.08)}}
@keyframes lid{to{transform:translateY(-26px) rotate(-14deg);opacity:0}}
@keyframes flashout{from{opacity:1}to{opacity:0}}

/* answer key */
.keywork{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:8px 0 4px 12px;border-left:4px solid var(--pen)}
.kw-label{font:700 .7rem var(--body);text-transform:uppercase;letter-spacing:.14em;color:var(--pen)}
.kline{font-family:var(--hand);color:var(--pen);font-size:1.4rem;line-height:1.25;overflow-wrap:anywhere}
.keyrow{margin:12px 0 0}
.key-list{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.key-card{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:14px 16px;box-shadow:4px 4px 0 var(--shade);scroll-margin-top:80px}
.key-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.key-head h3{font-size:1.1rem;flex:1;min-width:0}
.key-head .tag{font-family:var(--mono);font-size:.8rem;background:var(--hi);color:var(--on-hi);padding:2px 8px;border-radius:6px}
.key-part{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}
.key-q{max-width:70ch}
.key-work{display:flex;flex-direction:column;gap:2px;padding:4px 0 0 12px;border-left:4px solid var(--pen);width:100%}
.key-graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:6px;max-width:760px}

/* ---- loot, case opening, casino and look (v2) ---- */
.pity{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px;font-size:.85rem}
.pity .bar{flex:1;min-width:160px;height:10px;border:2px solid var(--edge);border-radius:99px;overflow:hidden;background:var(--soft)}
.pity .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--r-epic),var(--r-leg));transition:width .4s}
.recent{margin:14px 0 4px;display:flex;flex-direction:column;gap:6px}
.recent .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.recent-row,.plinko-hist,.mult-ladder,.ladder-rungs{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;border:2px solid var(--rc,var(--line));border-radius:999px;padding:1px 9px;font:700 .78rem var(--mono);color:var(--ink);background:var(--card)}
.pill.on{background:var(--rc);color:#fff}
.pill.done{opacity:.6}
.stage{display:flex;flex-direction:column;gap:16px;align-items:center;min-height:320px;position:relative;padding-bottom:20px}
.stage>*{max-width:100%;min-width:0}
.stage>.reel,.stage>.reel-out,.stage>.multi,.stage>.summary{align-self:stretch;width:100%}
.stage .reel{overflow:hidden}
.stage .strip{width:max-content}
.case-art.big{display:flex;justify-content:center;padding:26px 0 8px}
.case-art.big svg{width:210px;height:auto;filter:drop-shadow(0 10px 18px color-mix(in srgb,var(--cc,var(--pen)) 45%,transparent))}
.case-art.big .lid{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s}
.case-art.open .lid{transform:translateY(-34px) rotate(-18deg);opacity:0}
.quake{animation:quake .42s linear}
@keyframes quake{20%{transform:translate(calc(var(--qp,1)*-5px),calc(var(--qp,1)*2px))}40%{transform:translate(calc(var(--qp,1)*5px),calc(var(--qp,1)*-2px))}60%{transform:translate(calc(var(--qp,1)*-3px),calc(var(--qp,1)*3px))}80%{transform:translate(calc(var(--qp,1)*3px),calc(var(--qp,1)*-1px))}}
.rays{position:fixed;left:50%;top:32%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(from 0deg,var(--rc) 0 6deg,transparent 6deg 18deg);opacity:.42;pointer-events:none;z-index:44;animation:spin 2.6s linear forwards,rayfade 2.6s ease-out forwards;-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%)}
@keyframes spin{to{transform:rotate(140deg)}}
@keyframes rayfade{0%{opacity:0}15%{opacity:.5}100%{opacity:0}}
.banner{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:60;font:400 clamp(2.2rem,8vw,4.2rem) var(--display);color:var(--rc);text-shadow:0 4px 0 var(--shade),0 0 24px var(--rc);pointer-events:none;white-space:nowrap;animation:bannerIn 1.9s ease-out forwards}
@keyframes bannerIn{0%{transform:translate(-50%,40px) scale(.4);opacity:0}15%{transform:translate(-50%,0) scale(1.12);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-10px) scale(1);opacity:0}}
.perk{color:var(--f-lift);font-weight:700;margin:0}
.summary{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;border:2px solid var(--edge);border-radius:14px;padding:14px;background:var(--card);box-shadow:4px 4px 0 var(--shade);width:100%}
.flip{background:none;border:0;padding:0;cursor:pointer;height:170px;width:100%}
.flip-front .tile{width:100%;height:100%}
.flip.dup .flip-front{outline:2px dashed var(--muted);outline-offset:-6px;border-radius:12px}
.flip.shiny.open .flip-front .tile{box-shadow:0 0 22px var(--r-leg)}
.multi{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));width:100%}
.ghost-link{align-self:flex-start;box-shadow:none}
.casino-note{max-width:72ch;margin-top:14px}
.tabs{margin:0 0 14px;gap:8px}
.sel{font:700 .95rem var(--body);padding:7px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink)}
.plinko-cv{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;border-radius:10px}
.plinko-hist{justify-content:center;margin-top:8px}
.rocket-cv{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.mines-wrap{width:100%;max-width:420px;margin:0 auto}
.mines-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mine-cell{aspect-ratio:1;border:2px solid var(--edge);border-radius:10px;background:var(--card);box-shadow:0 3px 0 var(--shade);padding:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.mine-cell:hover:not(:disabled){transform:translateY(-2px);background:var(--soft)}
.mine-cell:disabled{cursor:default;opacity:1}
.mine-cell svg{width:100%;height:100%}
.mine-cell.gem{background:color-mix(in srgb,#4dabf7 22%,var(--card));animation:pop .3s}
.mine-cell.mine{background:color-mix(in srgb,#343a40 40%,var(--card))}
.mine-cell.boom{background:var(--bad);animation:shake .35s}
.share{align-items:flex-start;border-top:1px dashed var(--line);padding-top:12px}
.code-in{font:600 .9rem var(--mono);padding:7px 9px;border:2px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0;flex:1;max-width:100%}
.char-av > svg{animation:idle 3.2s ease-in-out infinite;transform-origin:50% 90%}
.char-av.cheer > svg{animation:hop .4s ease-out 2}
@keyframes idle{50%{transform:translateY(-3px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@media (prefers-reduced-motion: reduce){.eyes,.char-av > svg{animation:none}}
.credit{max-width:1040px;margin:0 auto;padding:12px 16px 28px;font-size:.78rem;color:var(--muted)}
.credit a{color:inherit}
.vec{width:100%;height:100%;display:block}
/* cosmetic arrow skins */
.laser{animation:dash .6s linear infinite}
.plasma{animation:plasma 1.1s ease-in-out infinite}

@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pulse{50%{stroke-opacity:.35}}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes flyL{to{transform:translateX(-140%) rotate(-18deg);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--hi),0 3px 0 var(--shade)}}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes dash{to{stroke-dashoffset:-15}}
@keyframes plasma{50%{opacity:.6}}
@keyframes flyR{to{transform:translateX(140%) rotate(18deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}}
/* ===== Roblox-style GUI skin: outlined bubble text, glossy 3D buttons, thick-outlined panels, dark top bar ===== */
:root{ --ol:2px 0 0 #15171c,-2px 0 0 #15171c,0 2px 0 #15171c,0 -2px 0 #15171c,1.6px 1.6px 0 #15171c,-1.6px -1.6px 0 #15171c,1.6px -1.6px 0 #15171c,-1.6px 1.6px 0 #15171c;
  --ol-sm:1.3px 0 0 #15171c,-1.3px 0 0 #15171c,0 1.3px 0 #15171c,0 -1.3px 0 #15171c; --r:18px }
body{background-color:var(--paper);
  background-image:radial-gradient(circle,var(--stud) 0 5px,transparent 6px),linear-gradient(180deg,var(--sky1),var(--sky2) 460px,var(--paper) 980px);
  background-size:28px 28px,100% 100%;background-repeat:repeat,no-repeat}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.gui-text,.hero h1,.sec-head h2,.lvl-head h2,.station.boss h2,.result h2,.lockcard h2,.banner{color:#fff;text-shadow:var(--ol),0 4px 0 #15171c}
.hero h1{font-size:clamp(2.2rem,6.2vw,3.8rem);line-height:1.05}
.hero h1 em{color:var(--gold1)}
.hero p{color:var(--ink)}
.sec-head h2{font-size:1.6rem}
.sec-head p{color:var(--ink);opacity:.8}
/* top bar */
.hud{background:var(--hud);border-bottom:3px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.25);backdrop-filter:blur(6px);color:#fff}
.logo{font-family:var(--display);font-weight:700;font-size:1.45rem;color:#fff;text-shadow:var(--ol-sm),0 3px 0 #15171c}
.logo span{background:linear-gradient(var(--gold1),var(--gold2));color:#fff;border:2px solid #15171c;border-radius:8px;padding:0 .3em;text-shadow:var(--ol-sm)}
.stat{flex-direction:row;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 12px 3px 4px}
.stat .k{font:700 .68rem var(--display);letter-spacing:.06em;color:#fff;border:2px solid #15171c;border-radius:999px;padding:1px 7px;text-shadow:var(--ol-sm);background:linear-gradient(var(--gold1),var(--gold2))}
.hud-stats div.stat:nth-of-type(2) .k{background:linear-gradient(var(--green1),var(--green2))}
.hud-stats div.stat:nth-of-type(3) .k{background:linear-gradient(var(--blue1),var(--blue2))}
.hud-stats div.stat:nth-of-type(4) .k{background:linear-gradient(var(--red1),var(--red2))}
.stat b{font:700 1.05rem var(--display);color:#fff;text-shadow:var(--ol-sm)}
.stat.hot{border-color:var(--gold2);box-shadow:0 0 12px var(--gold2)}
.stat.hot b{color:var(--gold1)}
.me-btn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:#fff}
.me-txt small{color:var(--gold1)}
.mini-av{border-color:#15171c}
.icon-btn{border:2px solid #15171c;background:linear-gradient(var(--btn1),var(--btn2));color:var(--ink);font:600 .8rem var(--display);box-shadow:0 3px 0 #000}
/* glossy 3D buttons */
.btn,.map-tab{border:3px solid #15171c;border-radius:14px;font-family:var(--display);font-weight:700;letter-spacing:.01em;color:var(--ink);
  background:linear-gradient(var(--btn1),var(--btn2));box-shadow:inset 0 3px 0 var(--gloss),inset 0 -4px 0 rgba(0,0,0,.18),0 4px 0 #15171c;
  transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover:not(:disabled),.map-tab:hover{filter:brightness(1.07)}
.btn:active:not(:disabled),.map-tab:active{transform:translateY(3px);box-shadow:inset 0 3px 0 var(--gloss),inset 0 -2px 0 rgba(0,0,0,.18),0 1px 0 #15171c}
.btn.primary,#shopBtn,#casinoBtn,.btn.on,.map-tab.on{color:#fff;text-shadow:var(--ol-sm),0 2px 0 #15171c}
.btn.primary{background:linear-gradient(var(--green1),var(--green2))}
.btn.on{background:linear-gradient(var(--blue1),var(--blue2))}
#shopBtn{background:linear-gradient(var(--gold1),var(--gold2))}
#casinoBtn{background:linear-gradient(var(--purple1),var(--purple2))}
@keyframes glow{50%{box-shadow:inset 0 3px 0 var(--gloss),inset 0 -4px 0 rgba(0,0,0,.18),0 4px 0 #15171c,0 0 0 4px var(--gold1),0 0 18px var(--gold2)}}
/* thick-outlined panels */
.step,.station,.cheat,.player,.key-card,.char-card,.summary,.lockcard{border:3px solid #15171c;border-radius:var(--r);box-shadow:inset 0 -5px 0 rgba(0,0,0,.07),0 6px 0 #15171c}
.step{padding:20px}
.cheat{background:linear-gradient(var(--card),var(--soft))}
.lockcard{background:linear-gradient(var(--gold1),var(--gold2));color:#1b1d22}
.lockin{border:3px solid #15171c;border-radius:12px;background:linear-gradient(var(--gold1),var(--gold2));color:#1b1d22;font-weight:700}
.player{background:linear-gradient(var(--card),var(--soft))}
.player-av,.char-av,.cel-av{border:3px solid #15171c;border-radius:14px}
.pname,.char-cap b{font-family:var(--display);font-weight:700}
/* map tabs */
.map-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 2px}
.map-tab{position:relative;display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:1.1rem}
.map-tab.on{background:linear-gradient(var(--green1),var(--green2))}
.mt-badge{position:absolute;top:-12px;right:-10px;transform:rotate(8deg);background:linear-gradient(var(--red1),var(--red2));color:#fff;border:2px solid #15171c;border-radius:8px;padding:0 6px;font:700 .72rem var(--display);text-shadow:var(--ol-sm);box-shadow:0 2px 0 #15171c}
.mt-stars{font:700 .78rem var(--display);background:rgba(0,0,0,.18);border-radius:999px;padding:1px 8px;text-shadow:none;color:inherit}
.map-tab:not(.on) .mt-stars{background:rgba(0,0,0,.08)}
/* station tiles */
.station{background:linear-gradient(180deg,var(--card) 55%,var(--soft));padding:16px;transition:transform .12s,box-shadow .12s}
.station:hover{transform:translateY(-4px) scale(1.015);box-shadow:inset 0 -5px 0 rgba(0,0,0,.07),0 10px 0 #15171c}
.station .tag{font:700 .78rem var(--display);letter-spacing:.04em}
.station .tag > span:first-child{background:linear-gradient(var(--blue1),var(--blue2));color:#fff;border:2px solid #15171c;border-radius:8px;padding:0 7px;text-shadow:var(--ol-sm)}
.station h2{font-size:1.3rem}
.stars{color:var(--gold1);text-shadow:var(--ol-sm);font-size:1.1rem}
.stars .off{color:var(--line);text-shadow:none}
.station.boss{background:linear-gradient(135deg,var(--red1),var(--red2) 60%,#8f1028);color:#fff}
.station.boss p,.station.boss .tag{color:#fff}
.station.boss h2{font-size:1.8rem}
.station.boss .tag > span:first-child{background:#15171c}
.station.extra{background:linear-gradient(180deg,var(--card) 55%,var(--soft))}
/* level stage */
.lvl-head .tag{font:700 .85rem var(--display);background:linear-gradient(var(--gold1),var(--gold2));color:#fff;border:2px solid #15171c;border-radius:8px;text-shadow:var(--ol-sm)}
.lvl-head h2{font-size:clamp(1.5rem,4.4vw,2.2rem)}
.dots i{width:14px;height:14px;border:2px solid #15171c}
.dots i.done{background:var(--green2);border-color:#15171c}
.dots i.now{background:var(--gold1)}
.step .q{font-size:1.15rem}
.opt,.eqchip,.rank-card,.mine-cell{border:3px solid #15171c;border-radius:14px;background:linear-gradient(var(--btn1),var(--btn2));box-shadow:inset 0 3px 0 var(--gloss),0 4px 0 #15171c;transition:transform .08s,box-shadow .08s}
.opt:hover:not(:disabled),.eqchip:hover:not(:disabled){background:linear-gradient(var(--gold1),var(--gold2));color:#1b1d22}
.opt:active:not(:disabled),.eqchip:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 3px 0 var(--gloss),0 1px 0 #15171c}
.opt.right{background:linear-gradient(var(--green1),var(--green2));color:#fff;border-color:#15171c;text-shadow:var(--ol-sm)}
.opt.wrong{background:transparent;box-shadow:none;border-color:var(--line)}
.opt svg{background:var(--card);border-radius:8px}
.blank,.ansbox,.unitsel,.betin,.name-in,.code-in,.sel,.num-row input{border:3px solid #15171c;border-radius:10px;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.wnum{background:linear-gradient(var(--blue1),var(--blue2));border:2px solid #15171c;color:#fff;font-family:var(--display);text-shadow:var(--ol-sm)}
.fullwork{border:3px solid #15171c;background:linear-gradient(var(--green1),var(--green2));color:#fff;text-shadow:var(--ol-sm)}
.timer{height:12px;border:2px solid #15171c}
.timer i{background:linear-gradient(var(--gold1),var(--gold2))}
.hearts{text-shadow:var(--ol-sm)}
.xp-pop{font:700 1.15rem var(--display);color:#fff;text-shadow:var(--ol-sm);background:linear-gradient(var(--green1),var(--green2));border:2px solid #15171c}
.xp-pop.chip{background:linear-gradient(var(--gold1),var(--gold2));color:#fff;border-color:#15171c}
.xp-pop.bad{background:linear-gradient(var(--red1),var(--red2));color:#fff;border-color:#15171c}
.banner{font-family:var(--display);font-weight:700;color:var(--rc);text-shadow:var(--ol),0 6px 0 #15171c,0 0 28px var(--rc)}
.bubble{border:3px solid #15171c;background:linear-gradient(var(--gold1),var(--gold2));font-family:var(--display)}
/* item tiles and cases */
.tile{border:3px solid #15171c;border-bottom:7px solid var(--rc,var(--line));border-radius:14px;font-family:var(--display);font-weight:600;
  background-image:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rc,transparent) 34%,transparent),transparent 72%)}
.rarity{font-family:var(--display);letter-spacing:.08em}
.drop{border-width:4px;border-radius:18px}
.reel{border:4px solid #15171c;border-radius:16px}
.marker{background:var(--gold1);box-shadow:0 0 0 2px #15171c}
.chip-pill,.pill{border-width:2px;font-family:var(--display)}
.vec.gi{padding:6px}
/* avatar editor (locker) */
.ae{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.ae-stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:10px}
.ae-viewwrap{position:relative;border:3px solid #15171c;border-radius:var(--r);overflow:hidden;box-shadow:0 6px 0 #15171c;background:linear-gradient(180deg,var(--ae1),var(--ae2))}
.ae-view{min-height:300px}
.ae-view > .v3d,.player-av > .v3d,.cel-av > .v3d{display:block}
.ae-view > .portrait3d{height:auto}
.ae-ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.ae-round{width:40px;height:40px;border-radius:50%;border:3px solid #15171c;background:linear-gradient(var(--btn1),var(--btn2));box-shadow:0 3px 0 #15171c;font:700 1.1rem var(--display);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.ae-round:active{transform:translateY(2px);box-shadow:0 1px 0 #15171c}
.ae-cap{display:flex;flex-direction:column;align-items:center;text-align:center}
.ae-cap b{font:700 1.4rem var(--display)}
.ae-cap span{color:var(--pen);font-weight:700}
.ae-wearing{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ae-wearing .k{width:100%;font:700 .72rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ae-chip{display:flex;align-items:center;gap:6px;border:2px solid #15171c;border-left:6px solid var(--rc);border-radius:999px;background:var(--card);padding:2px 10px 2px 4px;font:600 .8rem var(--display);color:var(--ink)}
.ae-chip-ic{width:26px;height:26px;display:flex}
.ae-chip-ic > *{width:100%;height:100%;object-fit:contain}
.ae-chip b{color:var(--muted)}
.ae-detail:empty{display:none}
.ae-detail{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;border:3px solid #15171c;border-top:7px solid var(--rc);border-radius:16px;background:var(--card);padding:10px;box-shadow:0 5px 0 #15171c}
.ae-dicon{width:84px;height:84px;border-radius:12px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 32%,transparent),transparent 70%),var(--ae-tile);display:flex;align-items:center;justify-content:center}
.ae-dicon > *{width:92%;height:92%;object-fit:contain}
.ae-dinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.ae-dinfo b{font:700 1.15rem var(--display)}
.ae-dinfo p{margin:0;font-size:.9rem}
.ae-panel{background:var(--card);border:3px solid #15171c;border-radius:var(--r);box-shadow:0 6px 0 #15171c;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ae-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.ae-cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:80px;padding:8px 6px;border:3px solid transparent;border-radius:14px;background:var(--soft);font:700 .8rem var(--display);color:var(--ink)}
.ae-cat .ae-ico{width:26px;height:26px;display:flex}
.ae-cat .ae-ico svg{width:100%;height:100%}
.ae-cat.on{background:linear-gradient(var(--blue1),var(--blue2));color:#fff;border-color:#15171c;box-shadow:0 3px 0 #15171c;text-shadow:var(--ol-sm)}
.ae-subs{display:flex;gap:6px;flex-wrap:wrap}
.ae-sub{border:2px solid #15171c;border-radius:999px;background:var(--card);padding:5px 14px;font:700 .85rem var(--display);color:var(--ink)}
.ae-sub.on{background:#15171c;color:#fff}
.ae-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ae-search{flex:1;min-width:140px}
.ae-toggle{display:flex;align-items:center;gap:6px;font:600 .85rem var(--display)}
.ae-count{font-size:.8rem;color:var(--muted)}
.ae-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.ae-tile{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border:3px solid #15171c;border-radius:14px;background:var(--card);box-shadow:0 4px 0 #15171c;text-align:center;transition:transform .1s;color:var(--ink)}
.ae-tile:hover{transform:translateY(-3px)}
.ae-tile:active{transform:translateY(2px);box-shadow:0 2px 0 #15171c}
.ae-img{aspect-ratio:1;border-radius:10px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 72%),var(--ae-tile);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:5px solid var(--rc)}
.ae-img > img,.ae-img > svg,.ae-img > div{width:92%;height:92%;object-fit:contain}
.ae-name{font:600 .78rem/1.15 var(--display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.ae-tile.worn{outline:4px solid var(--green2);outline-offset:1px}
.ae-check{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;background:linear-gradient(var(--green1),var(--green2));border:3px solid #15171c;color:#fff;font:700 .9rem var(--display);font-style:normal;display:flex;align-items:center;justify-content:center;text-shadow:var(--ol-sm)}
.ae-n{position:absolute;top:10px;left:10px;font:700 .72rem var(--display);font-style:normal;background:#15171c;color:#fff;border-radius:999px;padding:0 6px}
.ae-sh{position:absolute;top:8px;right:12px;font-style:normal;color:var(--gold1);text-shadow:var(--ol-sm)}
.ae-tile.locked .ae-img > *{filter:brightness(0) opacity(.3)}
.ae-lock{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);color:var(--ink);font-style:normal;opacity:.85}
.ae-empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ae-empty b{font:700 1.3rem var(--display)}
.ae-empty p{margin:0;max-width:44ch;color:var(--muted)}
.ae-body{display:flex;flex-direction:column;gap:14px}
.thumb3d{transition:opacity .25s}
.thumb3d.loading{opacity:0}
.ti-fallback{width:80%;height:80%;border-radius:12px;background:var(--rc);display:flex;align-items:center;justify-content:center;font:700 2rem var(--display);color:#fff}
.portrait3d{width:100%;height:100%;object-fit:contain;display:block}
.player-av{background:linear-gradient(180deg,var(--ae1),var(--ae2));min-height:150px}
.mini-av .portrait3d{transform:scale(1.15)}
@media (max-width:820px){ .ae{grid-template-columns:minmax(0,1fr)} .ae-stage{position:static} .ae-grid{grid-template-columns:repeat(auto-fill,minmax(94px,1fr))} }
/* 3D case opening */
.cs-wrap{position:relative;width:100%;border:3px solid #15171c;border-radius:var(--r);overflow:hidden;box-shadow:0 6px 0 #15171c;background:#0b0e14}
.cs-view{position:relative;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--gc) 60%,transparent),transparent 62%),linear-gradient(#1c2333,#0b0e14);transition:background .35s}
.cs-view .v3d{display:block;cursor:pointer}
.cs-hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font:700 clamp(1.3rem,4vw,1.8rem) var(--display);color:#fff;text-shadow:var(--ol),0 4px 0 #15171c;pointer-events:none;white-space:nowrap;animation:hintbob 1s ease-in-out infinite}
.cs-dots{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
.cs-dots i{width:18px;height:18px;border-radius:50%;border:3px solid #15171c;background:rgba(255,255,255,.35)}
.cs-dots i.on{background:var(--gold1);box-shadow:0 0 12px var(--gold1)}
.cs-name{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:pop .45s ease-out;width:max-content;max-width:94%}
.cs-name span{font:700 .95rem var(--display);letter-spacing:.14em;color:var(--rc);text-shadow:var(--ol-sm)}
.cs-name b{font:700 clamp(1.4rem,4.4vw,2.3rem) var(--display);color:#fff;text-shadow:var(--ol),0 4px 0 #15171c}
.case3d{width:150px;height:auto;display:block}
.flip-back .case3d{width:82%}
.case-art img.case3d{filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
@keyframes hintbob{50%{transform:translate(-50%,-6px)}}
/* juice */
.coin-fly{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:70;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff7c2,var(--gold1) 40%,var(--gold2));border:2px solid #15171c;box-shadow:0 0 10px var(--gold1)}
.coin-fly::after{content:'\2605';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 12px var(--display);color:#fff;text-shadow:var(--ol-sm)}
.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.22)}100%{transform:scale(1)}}
.toast{position:fixed;left:50%;top:86px;transform:translateX(-50%);z-index:65;font:700 clamp(1.6rem,5vw,2.6rem) var(--display);color:#fff;text-shadow:var(--ol),0 5px 0 #15171c;pointer-events:none;white-space:nowrap;animation:toastIn 1.7s ease-out forwards}
.toast.hot{color:var(--gold1)}
.toast.bad{color:#ffd6db;font-size:1.3rem}
@keyframes toastIn{0%{transform:translate(-50%,20px) scale(.5);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}
.ring{animation:ringpulse .55s ease-out}
@keyframes ringpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green2) 75%,transparent),0 4px 0 #15171c}100%{box-shadow:0 0 0 20px transparent,0 4px 0 #15171c}}
.bigstars .st{display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both;color:var(--gold1);text-shadow:var(--ol)}
.bigstars .st.off{color:var(--line);text-shadow:none}
@keyframes starpop{0%{transform:scale(0) rotate(-45deg);opacity:0}100%{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .2s}
.modal{max-width:440px;width:100%;background:var(--card);border:4px solid #15171c;border-radius:22px;box-shadow:0 8px 0 #15171c;padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:modalpop .4s cubic-bezier(.2,1.5,.4,1)}
.modal h2{font-size:2rem;color:#fff;text-shadow:var(--ol),0 4px 0 #15171c}
.modal p{margin:0}
.rankup{background:linear-gradient(var(--gold1),var(--gold2));color:#1b1d22}
.ru-badge{width:110px;height:110px;margin:0 auto;border-radius:50%;border:4px solid #15171c;background:#fff;overflow:hidden}
.ru-name{font:700 1.7rem var(--display)}
@keyframes modalpop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
/* 3D hangout: Roblox-style in-game GUI */
body.in-hangout{overflow:hidden}
.hg [hidden]{display:none!important}
.hg{position:fixed;inset:0;z-index:40;background:#8fd3ff;user-select:none;-webkit-user-select:none;touch-action:none;font-family:var(--display)}
.hg-canvas{position:absolute;inset:0;display:block;touch-action:none}
.hg-top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:flex-start;gap:10px;pointer-events:none}
.hg-top > *{pointer-events:auto}
.hg-menu{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(17,20,26,.72);color:#fff;display:flex;align-items:center;justify-content:center}
.hg-menu span{background:#fff;color:#15171c;border-radius:6px;padding:2px 5px;font:700 .8rem var(--display)}
.hg-cash{margin:0 auto;display:flex;align-items:center;gap:8px;background:rgba(17,20,26,.72);border-radius:999px;padding:5px 16px 5px 6px;color:#fff}
.hg-cash i{width:34px;height:34px;border-radius:50%;background:linear-gradient(var(--green1),var(--green2));border:3px solid #15171c;font:700 1.1rem var(--display);font-style:normal;display:flex;align-items:center;justify-content:center;text-shadow:var(--ol-sm)}
.hg-cash b{font:700 1.6rem var(--display);text-shadow:var(--ol-sm)}
.hg-cash small{font:700 .85rem var(--display);color:#9dffb0}
.hg-board{flex:none;min-width:210px;background:rgba(17,20,26,.72);border-radius:12px;color:#fff;font:600 .82rem var(--display);padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.hg-bh,.hg-br{display:grid;grid-template-columns:1fr 64px 40px;gap:6px}
.hg-bh{color:#aab4c0;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:3px}
.hg-br.me{color:#ffe36b}
.hg-br span:not(:first-child),.hg-bh span:not(:first-child){text-align:right}
.hg-side{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.hg-sbtn{width:66px;height:66px;border-radius:16px;border:3px solid #15171c;box-shadow:0 4px 0 #15171c,inset 0 3px 0 rgba(255,255,255,.4);color:#fff;font:700 .72rem var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-shadow:var(--ol-sm)}
.hg-sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #15171c}
.hg-sbtn .hg-sico{font-size:1.45rem;line-height:1}
.hg-sbtn.blue{background:linear-gradient(var(--blue1),var(--blue2))}
.hg-sbtn.green{background:linear-gradient(var(--green1),var(--green2))}
.hg-sbtn.gold{background:linear-gradient(var(--gold1),var(--gold2))}
.hg-sbtn.purple{background:linear-gradient(var(--purple1),var(--purple2))}
.hg-chat{position:absolute;left:92px;bottom:16px;width:min(440px,60vw);display:flex;flex-direction:column;gap:3px;pointer-events:none}
.hg-line{background:rgba(17,20,26,.58);color:#fff;border-radius:8px;padding:3px 9px;font:600 .82rem/1.3 var(--body);transition:opacity 1.2s}
.hg-line.old{opacity:0}
.hg-prompt{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:8px;background:rgba(17,20,26,.84);border-radius:12px;padding:6px 14px 6px 6px;color:#fff;cursor:pointer;white-space:nowrap}
.hg-prompt.dis{opacity:.7}
.hg-key{width:40px;height:40px;border-radius:50%;background:conic-gradient(#ffe36b calc(var(--p) * 360deg),rgba(255,255,255,.25) 0);display:flex;align-items:center;justify-content:center;flex:none}
.hg-key i{width:31px;height:31px;border-radius:50%;background:#fff;color:#15171c;font:700 1rem var(--display);font-style:normal;display:flex;align-items:center;justify-content:center}
.hg-ptxt{display:flex;flex-direction:column;line-height:1.15}
.hg-ptxt small{font:600 .72rem var(--body);color:#c9d1db}
.hg-ptxt b{font:700 1.02rem var(--display)}
.hg-tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(17,20,26,.6);color:#fff;border-radius:999px;padding:6px 14px;font:600 .82rem var(--display);pointer-events:none;transition:opacity 1.2s;white-space:nowrap}
.hg-tip.fade{opacity:0}
.hg-joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);display:none;pointer-events:none}
.hg-joy.on{display:block}
.hg-joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.75)}
.hg-btns{position:absolute;right:18px;bottom:22px;display:none;gap:14px;align-items:flex-end}
.hg-act,.hg-jump{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.65);background:rgba(17,20,26,.55);color:#fff;font:700 1.5rem var(--display)}
.hg-jump{width:88px;height:88px;font-size:2rem}
.hg-menupop{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--card);border:3px solid #15171c;border-radius:16px;box-shadow:0 6px 0 #15171c;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:240px}
.hg-teleport{position:absolute;inset:0;background:rgba(10,14,22,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:fadein .3s}
.hg-teleport b{font:700 2.4rem var(--display);text-shadow:var(--ol)}
.hg-teleport span{font:600 1.2rem var(--display)}
.hg-quiz .modal{max-width:660px;max-height:90vh;overflow:auto;text-align:left;font-family:var(--body)}
.hg-quiz .modal h2{text-align:center}
.play-btn{background:linear-gradient(var(--green1),var(--green2));color:#fff;text-shadow:var(--ol-sm),0 2px 0 #15171c;font-size:1.05rem;width:100%}
@media (pointer:coarse){ .hg-btns{display:flex} .hg-tip{display:none} .hg-chat{bottom:124px;left:12px} }
@media (max-width:720px){ .hg-board{display:none} .hg-side{top:auto;bottom:130px;transform:none} .hg-sbtn{width:54px;height:54px} .hg-cash b{font-size:1.3rem} .hg-chat{width:calc(100vw - 24px)} }
/* 3D casino */
.cz-view{position:relative;width:100%;border:3px solid #15171c;border-radius:var(--r);overflow:hidden;box-shadow:0 6px 0 #15171c;background:radial-gradient(circle at 50% 30%,#2a3560,#0d1224 75%)}
.cz-view .v3d{display:block}
.cz-view.mines3d{background:radial-gradient(circle at 50% 40%,#28324a,#0d1224 80%)}
.cz-view.coin3d{background:radial-gradient(circle at 50% 45%,#3a2f12,#14100a 80%)}
.cz-mult{position:absolute;right:16px;top:12px;z-index:2;font:700 clamp(2rem,6vw,3rem) var(--display);color:#fff;text-shadow:var(--ol),0 4px 0 #15171c;pointer-events:none}
.cz-mult.crash{color:#ff6b61}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:720px){ .stat{padding:2px 9px 2px 3px} .hud-stats{gap:8px} .hud-stats div.stat:nth-of-type(3){display:none} .map-tab{padding:8px 12px;font-size:1rem} .step{padding:14px} }
.hud .stat b{white-space:nowrap}
@media (max-width:720px){ .hud{position:static} .hero,.fbd,.sim,.char{grid-template-columns:minmax(0,1fr)} .char-card{position:static} .drop{grid-template-columns:minmax(0,1fr);justify-items:center} .player{grid-template-columns:110px minmax(0,1fr)} .me-txt{display:none} .me-btn{padding:2px} .lockcard{flex-direction:column} .trade-row{grid-template-columns:48px minmax(0,1fr)} .trade-row .row{grid-column:1/-1} body{font-size:16px} .step{padding:14px} }
</style>
